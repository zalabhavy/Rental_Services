spring.application.name=rental
server.port=${PORT:8090}

# Database configuration
# Local: uses MySQL | Production (Render): uses PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/rental}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Bhavyzala@2109}

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
