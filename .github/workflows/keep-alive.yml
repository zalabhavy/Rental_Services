name: Keep Supabase Alive

on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Branches endpoint
        run: curl -sf https://rentwheels-api-hp4w.onrender.com/api/v1/branches || true

      - name: Ping Vehicles endpoint
        run: curl -sf https://rentwheels-api-hp4w.onrender.com/api/v1/vehicles || true

      - name: Ping Vehicle Types endpoint
        run: curl -sf https://rentwheels-api-hp4w.onrender.com/api/v1/vehicles/types || true

      - name: Ping Bookings endpoint
        run: curl -sf https://rentwheels-api-hp4w.onrender.com/api/v1/bookings || true

      - name: Ping Dashboard Stats endpoint
        run: curl -sf https://rentwheels-api-hp4w.onrender.com/api/v1/dashboard/stats || true
